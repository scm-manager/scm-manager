ext {
  parseScmVersion = { String value ->
    def matcher = value =~ /^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/
    if (!matcher.matches()) {
      throw new GradleException("version must match major.minor.patch[-qualifier], but was '${value}'")
    }
    [
      major: matcher.group(1).toInteger(),
      minor: matcher.group(2).toInteger(),
      micro: matcher.group(3).toInteger(),
      qualifier: matcher.group(4)
    ]
  }
}
