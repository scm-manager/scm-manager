plugins {
  id 'java-library'
  id 'org.scm-manager.java'
}

dependencies {
  api platform(project(':'))

  implementation libs.commonsDaemon
  implementation libs.jettyServer
  implementation libs.jettyWebapp

  // Server Config
  implementation libs.snakeYml

  // tests
  testImplementation libs.junitJupiterApi
  testImplementation libs.junitJupiterParams
  testRuntimeOnly libs.junitJupiterEngine
  testImplementation libs.junitPioneer
  testImplementation libs.assertj

  testImplementation libs.guava
}

test {
  //Requiered by set environment variable annotation
  //Explanation: https://junit-pioneer.org/docs/environment-variables/#warnings-for-reflective-access
  jvmArgs("--add-opens=java.base/java.util=ALL-UNNAMED", "--add-opens=java.base/java.lang=ALL-UNNAMED")
}
