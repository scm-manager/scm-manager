plugins {
  id 'org.scm-manager.smp' version '0.21.0'
}

dependencies {
  implementation('org.javahg:javahg:2.0.0') {
    exclude group: 'com.google.guava', module: 'guava'
    exclude group: 'org.slf4j'
  }
  implementation libs.commonsCompress
  testImplementation libs.shiroUnit
  testImplementation libs.logback

  // validation api
  testImplementation libs.validator
  testImplementation libs.elApi
  testImplementation libs.elRuntime
  testImplementation libs.resteasyValidatorProvider
}

scmPlugin {
  scmVersion = project.version
  core = true
  name = 'scm-hg-plugin'
  displayName = 'Mercurial'
  description = 'Plugin for the version control system Mercurial'
  author = 'Cloudogu GmbH'
  category = 'Source Code Management'
  avatarUrl = '/images/hg-logo.png'

  openapi {
    packages = [
      'sonia.scm.api.v2.resources'
    ]
  }
}

task testJar(type: Jar) {
  archiveClassifier = 'tests'
	from sourceSets.test.output
}

configurations {
  tests {
    canBeConsumed = true
    canBeResolved = false
  }
}

artifacts {
  tests(testJar)
}
