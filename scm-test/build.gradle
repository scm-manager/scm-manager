plugins {
  id 'java-library'
  id 'org.scm-manager.java'
}

dependencies {
  api platform(project(':'))
  api project(':scm-core')

  // tests
  api libs.junitJupiterApi
  api libs.junitJupiterParams
  api libs.junitJupiterEngine

  // junit 4 support
  api libs.junitVintageEngine
  api libs.junit

  // assertions
  api libs.hamcrestCore
  api libs.hamcrestLibrary
  api libs.assertj

  // mocking
  api libs.mockitoCore
  api libs.mockitoJunitJupiter

  // shiro
  api libs.shiroExtension
  api libs.shiroUnit

  // test rest api's
  api libs.resteasyCore
  api libs.resteasyValidatorProvider

  // test servlet api
  api libs.servletApi

  //validator
  api libs.validator
  api libs.elApi
  api libs.elRuntime
}
